name: benchmark

# Cross-platform performance comparison for the VDOS Gn expansion /
# FastConvolve hot path (tests/src/app_perfvdos -- see its own top comment),
# particularly to quantify how much slower Windows/MSVC is there relative to
# Linux/macOS.
#
# Builds only the one perfvdos target (skips the example/plugin build and
# the pip install step entirely, same trick as fastwindbg.yml used for the
# access-violation bisection), in Release, and runs it directly (not via
# ctest) to keep the log output pure timing lines.
#
# Each platform is run 3 times (the "repeat" axis below), so results are
# hopefully drawn from different underlying physical runners each time
# (GitHub's runners are ephemeral VMs, not guaranteed identical hardware
# even for the "same" runner label) -- comparing across those repeats
# gives a rough sense of run-to-run/host-to-host noise, rather than
# risking reading too much into a single noisy sample per platform.

on:
  push:
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
        include:
          - { os: windows-2022,   label: windows-2022 }
          - { os: ubuntu-latest,  label: ubuntu-latest }
          - { os: macos-latest,   label: macos-latest-arm64 }
          - { os: macos-15-intel, label: macos-15-intel }
    name: ${{ matrix.label }} (run ${{ matrix.repeat }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    #CMAKE_BUILD_TYPE matters for the single-config generators used on
    #Linux/macOS; it is silently ignored for Windows' multi-config Visual
    #Studio generator, where --config Release below is what actually
    #selects the optimised build instead. Passing both covers every
    #platform in this matrix with one recipe:
    - name: Configure CMake (Release)
      run: >
        cmake
        -S src
        -B build
        -DCMAKE_BUILD_TYPE=Release
        -DNCRYSTAL_BUILD_STRICT=ON
        -DNCRYSTAL_ENABLE_TESTING=ON
        2>&1 | tee configure.log

    - name: Build perfvdos
      run: >
        cmake
        --build build
        --config Release
        --target perfvdos
        2>&1 | tee build.log

    #Executable location differs between the single-config generators used
    #on Linux/macOS (build/tests/perfvdos) and Windows' multi-config VS
    #generator (build/tests/Release/perfvdos.exe):
    - name: Run benchmark
      run: |
        for cand in build/tests/Release/perfvdos.exe \
                    build/tests/Release/perfvdos \
                    build/tests/perfvdos; do
          if [ -f "$cand" ]; then
            EXE="$cand"
            break
          fi
        done
        if [ -z "${EXE:-}" ]; then
          echo "Could not locate the built perfvdos executable" >&2
          exit 1
        fi
        "$EXE" 2>&1 | tee perfvdos.log

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: perfvdos-${{ matrix.label }}-run${{ matrix.repeat }}-${{ github.sha }}
        path: |
          perfvdos.log
          configure.log
          build.log
        if-no-files-found: warn
