name: fastwindbg

# TEMPORARY workflow for quickly bisecting the Windows-only VDOS/SAB
# construction access violation (see the NCRYSTAL_DEBUG_PHONON breadcrumb
# trail added across ncrystal_core/src/{vdos,utils,stdscatfactory,
# dyninfoutils}/*.cc). Unlike basictest.yml's build_windows job, this:
#  - only targets one Windows runner (windows-2022), not the full matrix
#  - only configures/builds the 4 known-crashing test executables (and
#    their dependencies), skipping ~166 unrelated test apps, examples,
#    and any Python dependency installation
#  - skips the Debug config entirely (Release already reproduces the
#    crash identically, confirmed in basictest.yml's own Windows runs)
#  - always runs with NCRYSTAL_DEBUG_PHONON=1, so the breadcrumb trail
#    is captured without needing a second run
# Delete this file once the crash is understood/fixed.

on:
  workflow_dispatch:

jobs:
  fastwindbg:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.14'

    - name: Prepare log capture dir
      run: mkdir -p ci-logs

    #No pip install step here (deliberately): the 4 targeted apps are
    #plain C++ executables with no Python dependency beyond the stdlib
    #already needed by the test launcher script, and neither
    #NCRYSTAL_ENABLE_EXAMPLES nor MCTOOLS_REQUIRE_ALL_TEST_DEPS is set
    #below, so CMake configure does not need any extra packages present
    #(tests/examples that are missing deps are simply skipped/not
    #registered, which is fine -- we only run 4 specific tests anyway):
    - name: Configure CMake
      run: >
        cmake
        -S src
        -B build
        -DCMAKE_INSTALL_PREFIX=install
        -DNCRYSTAL_BUILD_STRICT=ON
        -DNCRYSTAL_ENABLE_TESTING=ON
        2>&1 | tee ci-logs/configure.log

    #Only the 4 known-crashing app targets (plus whatever they link
    #against), not the full test/example suite:
    - name: Build (targeted)
      run: >
        cmake
        --build build
        --config Release
        --target loadsimple
        --target fmavdos
        --target vapit1v1
        --target vdos2knldiag
        2>&1 | tee ci-logs/build.log

    #NCRYSTAL_DEBUG_PHONON=1 captures the breadcrumb trail; -R restricts
    #ctest to just the 4 corresponding registered tests:
    - name: CTest (targeted)
      env:
        NCRYSTAL_DEBUG_PHONON: '1'
      run: >
        ctest --test-dir ./build --build-config Release --no-tests=error --output-on-failure
        -R "app_rl_loadsimple|app_rl_fmavdos|app_rl_vapit1v1|app_rl_vdos2knldiag"
        --test-output-size-failed 100000 --test-output-truncation middle
        2>&1 | tee ci-logs/ctest.log

    - name: Package logs
      if: always()
      run: |
        mkdir -p ci-logs
        for f in build/CMakeFiles/CMakeConfigureLog.yaml \
                 build/CMakeFiles/CMakeError.log \
                 build/CMakeFiles/CMakeOutput.log \
                 build/Testing/Temporary/LastTest.log; do
          [ -f "$f" ] && cp "$f" ci-logs/
        done

    #Commit id goes in both the tarball filename and (crucially, per
    #GitHub's own naming: the download's filename comes from the
    #artifact's name, not the file inside it) the artifact name itself:
    - name: Bundle logs
      if: always()
      run: tar -czf fastwindbg-logs-${{ github.sha }}.tar.gz ci-logs

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fastwindbg-logs-${{ github.sha }}
        path: fastwindbg-logs-${{ github.sha }}.tar.gz
        if-no-files-found: warn
