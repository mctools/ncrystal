name: basictest

on:
  push:
  pull_request:
  schedule:
    - cron: '30 18 * * 0'  # 18:30 every Sunday

jobs:
  ncdevtool_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: src
      - name: Pip install packages for ncdevtool
        run: pip install -r ./src/devel/reqs/requirements_devel.txt
      - name: ncdevtool checks
        run: ./src/devel/bin/ncdevtool check -n "fix""me"

  build:
    needs: [ ncdevtool_check ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm,  CC: gcc-12,   CXX: g++-12,     python: '3.13', buildtype: 'Release' }
          # Temporarily disabled (slow); re-enable later:
          # - { os: ubuntu-24.04-arm,  CC: gcc-14,   CXX: g++-14,     python: '3.8',  buildtype: 'Debug' }
          - { os: ubuntu-22.04,      CC: gcc-10,   CXX: g++-10,     python: '3.9',  buildtype: 'Release' }
          # Temporarily disabled (slow); re-enable later:
          # - { os: ubuntu-latest,     CC: gcc-14,   CXX: g++-14,     python: '3.10', buildtype: 'Debug' }
          # - { os: ubuntu-latest,     CC: clang,    CXX: clang++,    python: '3.11', buildtype: 'Debug' }
          - { os: ubuntu-latest,     CC: gcc-12,   CXX: g++-12,     python: '3.12', buildtype: 'Release' }
          - { os: ubuntu-latest,     CC: gcc,      CXX: g++,        python: '3.14', buildtype: 'Release' }
          - { os: macos-latest,      CC: clang,    CXX: clang++,    python: "3.13", buildtype: 'Release' }
          - { os: macos-15-intel,    CC: clang,    CXX: clang++,    python: "3.11", buildtype: 'Release' }
    name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    defaults:
      run:
        #Explicit "bash" (rather than the platform default) also gives us
        #"-o pipefail", needed so a "cmd | tee log" step below still fails
        #the step if cmd itself fails:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    #workaround (cf. https://github.com/IAEA-NDS/endf-parserpy/issues/42):
    - name: Set INSTALL_ENDF_PARSERPY_CPP=no
      if: matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-15-intel' || matrix.os == 'windows-11-arm'
      run: echo "INSTALL_ENDF_PARSERPY_CPP=no" >> $GITHUB_ENV

    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}

    - name: Pip install dependencies
      run: python -mpip install -r ./src/devel/reqs/requirements_all_and_devel.txt

    - name: Prepare log capture dir
      run: mkdir -p ${{github.workspace}}/ci-logs

    - name: Configure CMake
      run: >
        cmake
        -S ${{github.workspace}}/src
        -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}
        -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
        -DNCRYSTAL_ENABLE_EXAMPLES=ON
        -DNCRYSTAL_BUILD_STRICT=ON
        -DNCRYSTAL_ENABLE_TESTING=ON
        -DMCTOOLS_REQUIRE_ALL_TEST_DEPS=ON
        -DNCRYSTAL_TEST_ENABLE_LONG=ON
        2>&1 | tee ${{github.workspace}}/ci-logs/configure.log

    - name: Build
      run: >
        cmake
        --build ${{github.workspace}}/build
        --config ${{ matrix.buildtype }}
        2>&1 | tee ${{github.workspace}}/ci-logs/build.log

    - name: CTest
      run: >
        ctest --test-dir ./build --no-tests=error --output-on-failure
        --test-output-size-failed 100000 --test-output-truncation middle
        2>&1 | tee ${{github.workspace}}/ci-logs/ctest.log

    - name: Package logs
      #Runs even if earlier steps failed -- that's when the logs matter most.
      #ctest's own LastTest.log has full (not just failure) output, unlike
      #the tee'd console capture above. Upload the plain directory (not a
      #tarball): collect_logs below bundles every leg into one tarball, and
      #a tarball-in-a-tarball would just be extra hassle to unpack:
      if: always()
      run: |
        mkdir -p ${{github.workspace}}/ci-logs
        for f in build/CMakeFiles/CMakeConfigureLog.yaml \
                 build/CMakeFiles/CMakeError.log \
                 build/CMakeFiles/CMakeOutput.log \
                 build/Testing/Temporary/LastTest.log; do
          [ -f "${{github.workspace}}/$f" ] && cp "${{github.workspace}}/$f" ${{github.workspace}}/ci-logs/
        done

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-logs-${{ matrix.os }}-${{ matrix.CC }}-py${{ matrix.python }}-${{ matrix.buildtype }}
        path: ${{github.workspace}}/ci-logs
        if-no-files-found: warn

  build_windows:
    #Separate job (rather than extra entries in build's matrix above) since
    #Windows needs its own approach: CMake's default (Visual Studio,
    #multi-config) generator is what finds MSVC, so unlike the other
    #platforms we deliberately do *not* set CC/CXX (that would push CMake
    #towards a Makefile/Ninja generator expecting "cl" already on PATH,
    #which it is not without a separate dev-prompt setup step), and the
    #build type is chosen at build/test time via --config rather than at
    #configure time. See https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
    #for available platform details.
    needs: [ ncdevtool_check ]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        #Explicit "bash" (git-bash, preinstalled on GitHub's Windows
        #runners) rather than the platform default (pwsh), so we get
        #"-o pipefail" for the "cmd | tee log" steps below, exactly like
        #the other platforms in the "build" job:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: src

    - name: Enable parallel cmake
      run: python ./src/devel/bin/ncdevtool nprocs --enable-github-parallel

    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.14'

    - name: Pip install dependencies
      run: python -mpip install -r ./src/devel/reqs/requirements_all_and_devel.txt

    - name: Prepare log capture dir
      run: mkdir -p ci-logs

    #NB: Paths below are relative (rather than "${{github.workspace}}/...",
    #as in the "build" job above) deliberately: github.workspace expands to
    #an OS-native path, i.e. Windows backslashes here, and bash treats an
    #unescaped backslash as an escape character, silently mangling any such
    #path when it is interpolated into a run: command (e.g.
    #"D:\a\ncrystal\ncrystal" had its backslash-letter pairs eaten,
    #breaking "mkdir -p" and the "[ -f ... ]" test below it). Relative paths
    #sidestep the issue entirely, since run: steps already default to
    #github.workspace as their working directory:
    - name: Configure CMake
      run: >
        cmake
        -S src
        -B build
        -DCMAKE_INSTALL_PREFIX=install
        -DNCRYSTAL_ENABLE_EXAMPLES=ON
        -DNCRYSTAL_BUILD_STRICT=ON
        -DNCRYSTAL_ENABLE_TESTING=ON
        -DMCTOOLS_REQUIRE_ALL_TEST_DEPS=ON
        -DNCRYSTAL_TEST_ENABLE_LONG=ON
        2>&1 | tee ci-logs/configure.log

    #Debug first, and deliberately not aborting the job on failure here
    #(continue-on-error): the point of running Debug at all right now is
    #diagnostic -- MSVC's Debug CRT has iterator/heap debugging
    #(_ITERATOR_DEBUG_LEVEL=2) enabled by default, which turns a plain
    #out-of-bounds access into an immediate, precise "Debug Assertion
    #Failed!" (container/index named) instead of Release's bare, mute
    #access violation. Same multi-config build dir as Release below, just
    #a different --config, so this needs no separate configure step:
    - name: Build (Debug)
      continue-on-error: true
      run: >
        cmake
        --build build
        --config Debug
        2>&1 | tee ci-logs/build-Debug.log

    - name: CTest (Debug)
      continue-on-error: true
      run: >
        ctest --test-dir ./build --build-config Debug --no-tests=error --output-on-failure
        --test-output-size-failed 100000 --test-output-truncation middle
        2>&1 | tee ci-logs/ctest-Debug.log

    #Copy out now: the Release ctest run below reuses (overwrites) the same
    #Testing/Temporary/LastTest.log:
    - name: Save Debug LastTest.log
      if: always()
      run: |
        mkdir -p ci-logs
        [ -f build/Testing/Temporary/LastTest.log ] && cp build/Testing/Temporary/LastTest.log ci-logs/LastTest-Debug.log || true

    - name: Build
      run: >
        cmake
        --build build
        --config Release
        2>&1 | tee ci-logs/build.log

    - name: CTest
      run: >
        ctest --test-dir ./build --build-config Release --no-tests=error --output-on-failure
        --test-output-size-failed 100000 --test-output-truncation middle
        2>&1 | tee ci-logs/ctest.log

    - name: Package logs
      if: always()
      run: |
        mkdir -p ci-logs
        for f in build/CMakeFiles/CMakeConfigureLog.yaml \
                 build/CMakeFiles/CMakeError.log \
                 build/CMakeFiles/CMakeOutput.log \
                 build/Testing/Temporary/LastTest.log; do
          [ -f "$f" ] && cp "$f" ci-logs/
        done

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-logs-${{ matrix.os }}
        path: ci-logs
        if-no-files-found: warn

  collect_logs:
    #Single job downloading every per-leg "ci-logs-*" artifact above and
    #re-bundling them into one tarball, so the whole matrix's build/test
    #output can be grabbed with a single download instead of one per leg.
    name: Collect all CI logs
    needs: [ ncdevtool_check, build, build_windows ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-leg logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-logs-*
          path: all-ci-logs

      - name: Bundle into a single tarball
        run: tar -czf all-ci-logs-${{ github.sha }}.tar.gz all-ci-logs

      - name: Upload combined log tarball
        #The artifact "name:" (not the file inside it) is what GitHub uses
        #for the downloadable zip's filename on the Actions run page, so it
        #needs the commit sha too, not just the tarball path below:
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: all-ci-logs-${{ github.sha }}
          path: all-ci-logs-${{ github.sha }}.tar.gz
          if-no-files-found: warn

